<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="description" content="八字命盘：输入出生信息，自动排盘并按传统规则分析。">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>八字命盘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECE8DF; --panel:#F8F6F0; --ink:#23201C; --muted:#6C655B; --line:#D6CDBD; --soft:#E7E1D4;
  --seal:#A8322D; --seal-ink:#FFF8F0; --accent:#2F6F74;
  --r-good:#2F7A55; --r-ok:#4E8C8F; --r-even:#8A857B; --r-tight:#B57A1E; --r-bad:#A8322D;
  --brush:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif;
  --serif:"Noto Serif SC","Noto Serif JP","Songti SC","SimSun","Hiragino Mincho ProN",serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141518; --panel:#1D1E22; --ink:#E9E3D7; --muted:#A49D91; --line:#36373C; --soft:#26272C;
    --seal:#D25A4E; --seal-ink:#1A0F0D; --accent:#72B6BA;
    --r-good:#6FBF8E; --r-ok:#79B9BC; --r-even:#9C978D; --r-tight:#E0A94F; --r-bad:#E57366;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141518; --panel:#1D1E22; --ink:#E9E3D7; --muted:#A49D91; --line:#36373C; --soft:#26272C;
  --seal:#D25A4E; --seal-ink:#1A0F0D; --accent:#72B6BA;
  --r-good:#6FBF8E; --r-ok:#79B9BC; --r-even:#9C978D; --r-tight:#E0A94F; --r-bad:#E57366;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:28px 20px 60px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:16px}
.seal{width:54px;height:54px;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;font-family:var(--brush);font-size:34px;border-radius:6px;box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 4.5px var(--seal-ink);line-height:1}
h1{font-family:var(--brush);font-weight:400;font-size:40px;line-height:1.1;margin:0;letter-spacing:.04em}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:6px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}}
main{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.form label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.form label:first-child{margin-top:0}
.form label.sublab{margin:6px 0 3px;font-size:12px}
.form input[type=text],.form input[type=date],.form input[type=time],.form input[type=number],.form select{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.form input:focus-visible,.form select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px}
.seg label{margin:0;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:7px 4px;cursor:pointer;color:var(--ink);font-size:14px;background:var(--bg)}
.seg input{accent-color:var(--seal)}
.check{display:flex!important;align-items:flex-start;gap:8px;color:var(--ink)!important;font-size:13px!important;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--seal)}
.hint{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{font:inherit;font-size:14px;border-radius:8px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn.primary{background:var(--seal);border-color:var(--seal);color:var(--seal-ink);flex:1}
.btn[hidden]{display:none}
.saved{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.saved h3{font-size:13px;color:var(--muted);font-weight:400;margin:0 0 6px}
.saved ul{list-style:none;margin:0;padding:0}
.saved li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;font-size:14px}
.saved li button{font:inherit;font-size:12px;background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 4px}
.saved li button.del{color:var(--muted)}
.empty{padding:72px 24px;text-align:center;color:var(--muted);font-size:15px}
.tipcard{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px;text-align:center}
.tipcard h3{font-size:15px;margin:0 0 4px}
.tipcard p{font-size:13px;margin:0 0 10px;line-height:1.6}
.tipcard img{width:160px;height:auto;max-width:100%;border-radius:8px;background:#fff;padding:6px;display:block;margin:0 auto 6px}
.tipbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:14px}
.tipbar[hidden]{display:none}
@media (max-width:640px){
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr{display:block;width:100%}
  table.stack tr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 10px;background:var(--panel)}
  table.stack tr.now{border-color:var(--seal);box-shadow:0 0 0 1px var(--seal) inset}
  table.stack tr.now td{background:none}
  table.stack td{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;border:0;padding:4px 0}
  table.stack td::before{content:attr(data-l);color:var(--muted);font-size:12px;padding-top:2px}
}
.gloss{border:1px solid var(--line);border-radius:12px;padding:10px 16px 6px;background:var(--panel);margin:12px 0 18px}
.gloss summary{cursor:pointer;font-weight:600;padding:4px 0;color:var(--ink)}
.gloss summary::marker{color:var(--seal)}
.gloss p{max-width:900px}
.real{border-left:3px solid var(--seal);padding:4px 0 4px 12px;margin:10px 0 16px;max-width:900px;line-height:1.8}
.real strong{color:var(--seal);font-weight:600}
.mean{font-size:13px;margin-top:4px;line-height:1.6}
.mean strong{color:var(--seal);font-weight:600}
.err{color:var(--seal);font-size:13px;margin-top:8px;min-height:1em}
.chartcard{padding:0;overflow:hidden}
.charthead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.layers{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--ink);background:var(--bg);user-select:none}
.chip input{accent-color:var(--seal);margin:0}
.chartscroll{overflow-x:auto}
.chartscroll svg{display:block;min-width:760px;width:100%;height:auto}
@media (max-width:600px){.chartscroll svg{min-width:680px}}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.lc{flex:0 0 auto;min-width:74px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
.lc[aria-pressed="true"]{border-color:var(--seal);box-shadow:0 0 0 1.5px var(--seal) inset}
.lc .gz{font-family:var(--brush);font-size:24px;line-height:1.2}
.lc .meta{font-size:11.5px;color:var(--muted);line-height:1.3}
.lc .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.sect{margin-top:18px}
.sect h2{font-size:15px;font-weight:600;margin:0 0 8px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;background:var(--bg);padding:10px 2px;margin:26px 0 0;border-bottom:1px solid var(--line);transition:box-shadow .2s}
.tabs::-webkit-scrollbar{display:none}
.tabs.stuck{box-shadow:0 8px 14px -10px rgba(0,0,0,.35)}
.tabs button{flex:0 0 auto;font:inherit;font-size:14.5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 16px;cursor:pointer;white-space:nowrap}
.tabs button:hover{border-color:var(--seal)}
.tabs button[aria-selected="true"]{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.tabs button .no{display:inline-block;font-size:12px;opacity:.7;margin-right:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.date3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:6px}
.form .date3 select{padding:8px 6px}
.tabpanel{padding:20px 2px 0}
.tabpanel h3{font-size:16px;font-weight:600;margin:22px 0 8px}
.tabpanel h3:first-child{margin-top:4px}
.tabpanel p{margin:6px 0;max-width:72ch}
.tblwrap{overflow-x:auto}
table.tbl{border-collapse:collapse;font-size:14px;min-width:100%;margin:4px 0 8px}
.tbl th,.tbl td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:400;color:var(--muted);font-size:13px;white-space:nowrap}
.tbl tr.now td{background:var(--soft)}
.gzc{font-family:var(--brush);font-size:19px;letter-spacing:.04em}
.rate{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;border:1px solid currentColor;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--soft);min-width:120px;overflow:hidden}
.bar i{display:block;height:100%}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 28px}
.note{font-size:13px;color:var(--muted);margin-top:18px;max-width:80ch}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:0 6px;background:var(--soft);margin-right:4px}

.scorebar{display:flex;justify-content:flex-end;margin-bottom:-6px}
.seg2{display:inline-flex;gap:6px}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:3px 11px;font-size:14px;line-height:1.5}
.cmp{display:flex;gap:6px;flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.chip input:disabled~*{opacity:.45}
.radarwrap{position:relative;margin-top:12px}
.radarscroll{overflow-x:auto}
.radarscroll svg{display:block;width:100%;max-width:720px;min-width:330px;height:auto;margin:0 auto}
.radar .hit{cursor:pointer;outline:none}
.radar .hit:focus-visible{stroke:var(--accent);stroke-width:2}
.tip{position:absolute;z-index:5;max-width:280px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.55;box-shadow:0 6px 18px rgba(0,0,0,.14);pointer-events:none}
.board{margin-top:14px}
.bh{display:flex;align-items:center;gap:8px;font-weight:600;padding:6px 0;border-bottom:1px solid var(--line)}
.bh .hint{margin:0 0 0 auto}
.dim{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(150px,auto) minmax(200px,2fr);gap:6px 18px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
@media (max-width:760px){.dim{grid-template-columns:1fr}}
.dc{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dv{min-width:46px;text-align:center;font-size:19px;font-weight:600;line-height:1.2}
.dv.man{color:var(--seal)}
.dv em{display:block;font-style:normal;font-size:11px;font-weight:400}
.lnk{background:none;border:0;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;padding:0 2px}
.stamp{display:inline-block;font-size:12px;line-height:1.35;color:var(--seal-ink);background:var(--seal);border-radius:3px;padding:0 5px;margin-left:4px;font-family:var(--brush)}
.mdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--seal);vertical-align:middle;margin-left:3px}
@media (prefers-reduced-motion:no-preference){
  #chartsvg{animation:ink .6s ease-out both}
  @keyframes ink{from{opacity:0;filter:blur(2px)}to{opacity:1;filter:none}}
}
</style>

  const last=mo=>{const dim=new Date(Date.UTC(y,mo,0)).getUTCDate(),wd=new Date(Date.UTC(y,mo-1,dim)).getUTCDay();return dim-wd;};
  let s,e;
  if(y>=2007){s=[3,sun(3,2)];e=[11,sun(11,1)];}else if(y>=1987){s=[4,sun(4,1)];e=[10,last(10)];}

let lang='zh';
try{const l=localStorage.getItem('bazi.lang');if(l&&LANGS[l])lang=l;}catch(e){}
const L=()=>LANGS[lang];
function T(k,v){let s=L()[k];if(s===undefined)s=LANGS.zh[k];if(s===undefined)return k;if(typeof s!=='string')return s;if(v)s=s.replace(/\{(\w+)\}/g,(m,p)=>v[p]!==undefined?v[p]:'');return s;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- astronomy ---------- */
const DAY=86400000;
const msToJd=ms=>ms/DAY+2440587.5, jdToMs=jd=>(jd-2440587.5)*DAY;
function deltaT(y){if(y>=2005)return 64.7+0.3*(y-2005);if(y>=1986)return 54.9+0.52*(y-1986);if(y>=1950)return 29+0.72*(y-1950);return 24;}
function sunLon(jd){const y=2000+(jd-2451545)/365.25,jde=jd+deltaT(y)/86400,T=(jde-2451545)/36525,r=Math.PI/180;
  const L0=280.46646+36000.76983*T+0.0003032*T*T,M=357.52911+35999.05029*T-0.0001537*T*T;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M*r)+(0.019993-0.000101*T)*Math.sin(2*M*r)+0.000289*Math.sin(3*M*r);
  const om=125.04-1934.136*T;return mod(L0+C-0.00569-0.00478*Math.sin(om*r),360);}
function solveLon(target,jd){for(let i=0;i<12;i++){const d=mod(target-sunLon(jd)+180,360)-180;jd+=d/0.98565;if(Math.abs(d)<1e-7)break;}return jd;}
const jdn=(y,m,d)=>Math.round(msToJd(Date.UTC(y,m-1,d,12)));
const REF=jdn(1949,10,1);
function lichunJd(Y){return solveLon(315,msToJd(Date.UTC(Y,1,4,0)));}
function eot(ms){const d=new Date(ms),start=Date.UTC(d.getUTCFullYear(),0,0),N=Math.floor((ms-start)/DAY),Bv=2*Math.PI*(N-81)/364;return 9.87*Math.sin(2*Bv)-7.53*Math.cos(Bv)-1.5*Math.sin(Bv);}
function yearPillarAt(jd,Y){const y=jd<lichunJd(Y)?Y-1:Y;return {s:mod(y-4,10),b:mod(y-4,12),y};}
function monthPillarAt(jd,ys){const lam=sunLon(jd),k=Math.floor(mod(lam-315,360)/30);return {s:mod((ys%5)*2+2+k,10),b:(k+2)%12,k,lam};}
function dayPillar(y,m,d){const i=mod(jdn(y,m,d)-REF,60);return {s:i%10,b:i%12};}
const fmtD=ms=>{const d=new Date(ms);return L().dateFmt(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate());};

Object.assign(IP.zh,{"rgTitle": "术语说明：用神、喜神、闲神、仇神、忌神", "rgIntro": "这五个角色描述的是每种五行对本命局的作用。可以用看病来比喻：命局的失衡是“病”，用神是“药”，喜神是帮助药发挥作用的“助手”，忌神是“病源”，仇神是“帮凶”，闲神则是“旁观者”。", "cols": ["角色", "含义", "本工具的判定方法", "有什么意义"], "rows": [["对命局最有帮助、最能平衡命局的五行。", "综合扶抑（日主强弱）、格局（格局成败所需）、调候（寒暖燥湿）三法，取多数一致者。", "最值得投入的方向。大运流年遇到用神五行，通常较为顺利。"], ["辅助用神的五行，能生扶用神，或与用神同向帮助日主。", "日主偏弱时，取印星与比劫中未被选为用神的一方；其他情况取生助用神的五行。", "次要的有利方向，可以积极利用。"], ["对命局影响不大的五行，不帮也不害。", "未被归入其他四类的五行。", "顺其自然，不必刻意追求或回避。"], ["间接不利的五行，会生助忌神，或克制喜神。", "日主偏弱时，取忌神之外其他消耗日主的五行；其他情况取生助忌神的五行。", "宜有选择地投入，避免过度。"], ["对命局最不利的五行，会克制用神，或加重命局最大的失衡。", "日主偏弱时，取克、泄、耗日主力量最重的一类；其他情况取克制用神的五行。", "不必刻意回避，但要控制总量，并借助用神来承接。大运流年遇到忌神五行，压力通常较大。"]], "rgNote": "这五个角色只针对本命局成立：同一个五行，在不同的命局中角色可能完全相反。运势评价也由此而来：大运流年的天干地支属于用神、喜神则加分，属于仇神、忌神则减分。", "tips": ["用神：对命局最有帮助的五行", "喜神：辅助用神的五行", "闲神：影响不大的五行", "仇神：生助忌神的间接不利五行", "忌神：对命局最不利的五行"], "rgRef": "文中的用神、喜神、闲神、仇神、忌神，含义说明见「格局与用神」标签页。"});Object.assign(IP.ja,{"rgTitle": "用語の説明：用神・喜神・閑神・仇神・忌神", "rgIntro": "この五つの役割は、各五行が本命局に与える作用を表します。病気の治療にたとえると、命局の偏りが「病」、用神が「薬」、喜神が薬の効き目を助ける「助手」、忌神が「病の原因」、仇神が「その加担者」、閑神は「傍観者」にあたります。", "cols": ["役割", "意味", "本ツールの判定方法", "意義"], "rows": [["命局に最も役立ち、命局の偏りを最もよく整える五行。", "扶抑（日主の強弱）・格局（格局の成否に必要なもの）・調候（寒暖燥湿）の三法を総合し、多数が一致するものを取ります。", "最も投資する価値のある方向です。大運や流年で用神の五行が巡ると、おおむね順調です。"], ["用神を補助する五行。用神を生じたり、用神と同じ方向で日主を助けたりします。", "日主が弱い場合は、印星と比劫のうち用神に選ばれなかった方を取ります。それ以外は用神を生じる五行を取ります。", "二番目に有利な方向で、積極的に活用できます。"], ["命局への影響が小さく、助けも害もしない五行。", "他の四つに分類されなかった五行です。", "自然に任せ、無理に求めたり避けたりする必要はありません。"], ["間接的に不利な五行。忌神を生じたり、喜神を剋したりします。", "日主が弱い場合は、忌神以外で日主を消耗させる五行を取ります。それ以外は忌神を生じる五行を取ります。", "選んで投資し、やりすぎを避けましょう。"], ["命局に最も不利な五行。用神を剋したり、命局の最大の偏りを強めたりします。", "日主が弱い場合は、日主を剋・洩・耗する力が最も重い類を取ります。それ以外は用神を剋す五行を取ります。", "無理に避ける必要はありませんが、総量を抑え、用神で受け止めましょう。大運や流年で忌神の五行が巡ると、重圧が大きくなりがちです。"]], "rgNote": "この五つの役割は本命局に限って成り立ちます。同じ五行でも、命局が違えば役割が正反対になることがあります。運勢の評価もここから導かれ、大運・流年の干支が用神・喜神なら加点、仇神・忌神なら減点されます。", "tips": ["用神：命局に最も役立つ五行", "喜神：用神を補助する五行", "閑神：影響の小さい五行", "仇神：忌神を生じる間接的に不利な五行", "忌神：命局に最も不利な五行"], "rgRef": "文中の用神・喜神・閑神・仇神・忌神の意味は「格局と用神」タブで説明しています。"});Object.assign(IP.en,{"rgTitle": "Glossary: Useful, Favorable, Neutral, Adverse and Harmful elements", "rgIntro": "These five roles describe what each element does for this particular chart. Think of medicine: the chart’s imbalance is the illness, the Useful element is the medicine, the Favorable element is the helper that makes the medicine work, the Harmful element is the cause of the illness, the Adverse element is its accomplice, and the Neutral element is a bystander.", "cols": ["Role", "Meaning", "How this tool decides", "Why it matters"], "rows": [["The element that helps the chart most and best restores its balance.", "Combines three methods, strength balance, pattern and climate, and takes the element most of them agree on.", "The direction most worth investing in. Luck pillars carrying this element usually go smoothly."], ["The element that supports the Useful element, either by producing it or by helping the self in the same direction.", "With a weak self, it is whichever of Resource or Companions was not chosen as Useful; otherwise it is the element that produces the Useful element.", "A secondary favorable direction you can use actively."], ["An element with little effect, neither helping nor harming.", "Any element not placed in the other four roles.", "Let it be; no need to pursue or avoid it."], ["An indirectly unfavorable element that feeds the Harmful element or attacks the Favorable one.", "With a weak self, the other elements that drain the self besides the Harmful one; otherwise the element that produces the Harmful element.", "Invest selectively and avoid overdoing it."], ["The most unfavorable element, which attacks the Useful element or deepens the chart’s main imbalance.", "With a weak self, the group that controls, drains or exhausts the self most; otherwise the element that controls the Useful element.", "No need to avoid it, but limit the total and handle it with the Useful element. Luck pillars carrying it usually bring more pressure."]], }
function tabDomains(c){

  if(bad.length)h+=real(IPf('cWay',{bad:L().ind[bad[0]].split(lang==='en'?', ':/[、・]/).slice(0,3).join(lang==='en'?', ':'、'),way:I.way[catOf(c,c.fin)]}));
  const male=c.gender==='m',db=P[2].b,cy=new Date().getFullYear();
  h+=`<h3>${T('d_m')}</h3><p>${male?T('mMale',{a:c.tgAll[5],b:c.tgAll[4]}):T('mFem',{a:c.tgAll[7],b:c.tgAll[6]})}</p>`;

  const sc=male?2:3,es=ce(sc),sep=lang==='en'?' ':'';let mm=[];

    if(rs.length>=2||(rs.length&&rs.includes(L().reasons.spouse)))mY.push(`${y}${par(joinL(rs))}`);}
  if(mY.length)h+=`<p>${T('mTime',{list:mY.join(SEMI())})}</p>`;

  if(c.role[SE(P[3].s)]<=1)km.push(I.kHour);

  return h;
}

  const p=pal(),cy=new Date().getFullYear();
  $('luckstrip').innerHTML=C.luck.map((l,k)=>{const r=rateP(l,C);return `<button class="lc" aria-pressed="${k===SEL.luck}" data-k="${k}"><div class="gz"><span style="color:${p.el[SE(l.s)]}">${S[l.s]}</span><span style="color:${p.el[BE[l.b]]}">${B[l.b]}</span></div><div class="meta">${cy>=l.startY&&cy<l.startY+10?'<span style="color:var(--seal)">● </span>':''}${l.startY}</div><div class="meta"><span class="dot" style="background:${RC[r.i]}"></span>${l.age}${T('ageU')}</div></button>`;}).join('');
  const l=C.luck[SEL.luck],ys=[];for(let y=l.startY;y<l.startY+10;y++)ys.push(y);
  $('yearstrip').innerHTML=ys.map(y=>{const pp={s:mod(y-4,10),b:mod(y-4,12)},r=rateP(pp,C);return `<button class="lc" aria-pressed="${y===SEL.year}" data-y="${y}"><div class="gz"><span style="color:${p.el[SE(pp.s)]}">${S[pp.s]}</span><span style="color:${p.el[BE[pp.b]]}">${B[pp.b]}</span></div><div class="meta">${y===cy?'<span style="color:var(--seal)">● </span>':''}${y}</div><div class="meta"><span class="dot" style="background:${RC[r.i]}"></span>${L().rating[r.i]}</div></button>`;}).join('');
  $('luckstrip').querySelectorAll('button').forEach(b=>b.onclick=()=>{SEL.luck=+b.dataset.k;const L0=C.luck[SEL.luck];SEL.year=(cy>=L0.startY&&cy<L0.startY+10)?cy:L0.startY;renderChart();renderStrips();if(TAB===3)renderTab();});
  $('yearstrip').querySelectorAll('button').forEach(b=>b.onclick=()=>{SEL.year=+b.dataset.y;renderChart();renderStrips();if(TAB===3)renderTab();});
}
function renderTab(){
  const f=[tabBasic,tabStructure,tabPattern,tabFortune,tabDomains,tabApply,tabScore][TAB];
  $('tabpanel').innerHTML=f(C,SEL);if(TAB===6)bindScore();
}
function goTabs(){const a=$('tabsAnchor');if(!a)return;const top=a.getBoundingClientRect().top+window.scrollY;if(window.scrollY>top)window.scrollTo({top,behavior:'auto'});
  const b=$('tab'+TAB);if(b&&b.scrollIntoView)b.scrollIntoView({block:'nearest',inline:'nearest'});}
function stuckCheck(){const a=$('tabsAnchor'),n=$('tabs');if(a&&n)n.classList.toggle('stuck',a.getBoundingClientRect().top<0);}
window.addEventListener('scroll',stuckCheck,{passive:true});
function initDate(){const pr=(FORM.date||'').split('-').map(Number),yy=pr[0]||0,mm=pr[1]||0,dd=pr[2]||0,ph=k=>`<option value="">${T(k)}</option>`;
  const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let o=ph('yL');for(let y=1900;y<=2100;y++)o+=`<option value="${y}"${y===yy?' selected':''}>${lang==='en'?y:y+'年'}</option>`;$('f-y').innerHTML=o;
  o=ph('moL');for(let m=1;m<=12;m++)o+=`<option value="${m}"${m===mm?' selected':''}>${lang==='en'?MN[m-1]:m+'月'}</option>`;$('f-mo').innerHTML=o;
  fillDays(dd);$('f-y').onchange=$('f-mo').onchange=()=>fillDays(+$('f-d').value||0);$('f-d').onchange=syncDate;}
function fillDays(keep){const y=+$('f-y').value,m=+$('f-mo').value,n=m?new Date(Date.UTC(y||2000,m,0)).getUTCDate():31,d=Math.min(keep,n);
  let o=`<option value="">${T('dL')}</option>`;for(let i=1;i<=n;i++)o+=`<option value="${i}"${i===d?' selected':''}>${lang==='en'?i:i+'日'}</option>`;$('f-d').innerHTML=o;syncDate();}
function syncDate(){const y=$('f-y').value,m=$('f-mo').value,d=$('f-d').value;$('f-date').value=(y&&m&&d)?`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`:'';}
function renderTabs(){
  $('tabs').innerHTML=L().tabs.map((t,k)=>`<button role="tab" id="tab${k}" aria-selected="${k===TAB}" tabindex="${k===TAB?0:-1}"><span class="no">${k+1}</span>${t}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach((b,k)=>{b.onclick=()=>{TAB=k;renderTabs();renderTab();goTabs();};
    b.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){TAB=mod(TAB+(e.key==='ArrowRight'?1:-1),7);renderTabs();renderTab();$('tab'+TAB).focus();}};});
  $('tabpanel').setAttribute('aria-labelledby','tab'+TAB);
}
function renderLayers(){
  const items=[['roots','lyRoots'],['stem','lyStem'],['he','lyHe'],['ch','lyCh']];
  $('layers').innerHTML=items.map(([k,t])=>`<label class="chip"><input type="checkbox" data-l="${k}"${layers[k]?' checked':''}>${T(t)}</label>`).join('');
  $('layers').querySelectorAll('input').forEach(i=>i.onchange=()=>{layers[i.dataset.l]=i.checked;renderChart();});
  const p=pal();
  $('legend').innerHTML=[0,1,2,3,4].map(e=>`<span><svg width="14" height="14" viewBox="0 0 24 24">${ELI[e](p.el[e],p.dark?'#1D1E22':'#FFFDF8')}</svg>${L().el[e]}</span>`).join('')+
   `<span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="${p.muted}" stroke-width="1.7"/></svg>${T('lgStrong')}</span><span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="${p.muted}" stroke-width="1.3" stroke-dasharray="4 3"/></svg>${T('lgWeak')}</span>`+
   `<span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="${p.he}" stroke-width="1.4"/></svg>${T('lgHe')}</span><span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="${p.ch}" stroke-width="1.4"/></svg>${T('lgCh')}</span>`;
}
function renderStatic(){
  document.documentElement.lang=lang==='zh'?'zh-Hans':lang;
  document.title=T('title');$('t-title').textContent=T('title');$('t-sub').textContent=T('sub');
  $('t-luck').textContent=T('luckH');$('t-years').textContent=T('yearsH');$('t-disc').textContent=T('disc');
  $('b-png').textContent=T('png');$('b-svg').textContent=T('svg');
  if(!$('tipbar').hidden){$('tipbar-t').textContent=T('tipBar');$('tipbar-see').textContent=T('tipSee');$('tipbar-x').textContent=T('tipClose');}
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
}
function renderAll(){renderStatic();renderLayers();if(!C){$('chartwrap').innerHTML=`<div class="empty">${esc(T('emptyHint'))}</div>`;return;}renderChart();renderStrips();renderTabs();renderTab();}
/* saved charts */
function getSaved(){try{return JSON.parse(localStorage.getItem('bazi.saved.v1')||'[]');}catch(e){return [];}}
function setSaved(a){try{localStorage.setItem('bazi.saved.v1',JSON.stringify(a));}catch(e){}}
function saveChart(){const f=readForm(),a=getSaved(),sig=sigOf(f);const label=(f.name||T('savedName'))+' '+f.date+' '+f.time;const rest=a.filter(e=>sigOf(e.f)!==sig);rest.unshift({label,f,manual:getMan()[sig]||{}});setSaved(rest.slice(0,30));renderSaved();if(TAB===6)renderTab();}
function renderSaved(){const a=getSaved(),box=$('savedbox');if(!box)return;if(!a.length){box.innerHTML='';return;}
  box.innerHTML=`<h3>${T('saved')}</h3><ul>${a.map((s,k)=>`<li><span>${esc(s.label)}</span><span><button data-k="${k}" class="ld">${T('load')}</button><button data-k="${k}" class="del">${T('del')}</button></span></li>`).join('')}</ul>`;
  box.querySelectorAll('.ld').forEach(b=>b.onclick=()=>{const e=getSaved()[+b.dataset.k];const f0=Object.assign({},e.f);f0.city=normKey(f0.city);FORM=f0;if(e.manual&&Object.keys(e.manual).length){const m=getMan();m[sigOf(f0)]=e.manual;setMan(m);}buildForm();cast();});
  box.querySelectorAll('.del').forEach(b=>b.onclick=()=>{const x=getSaved();x.splice(+b.dataset.k,1);setSaved(x);renderSaved();if(TAB===6)renderTab();});}
/* export */
function exportName(ext){return `bazi-${(C.inp.name||'chart').replace(/[^\w\u4e00-\u9fff\u3040-\u30ff-]/g,'')}-${C.inp.y}${String(C.inp.m).padStart(2,'0')}${String(C.inp.d).padStart(2,'0')}.${ext}`;}
function svgString(scale){const el=$('chartsvg');if(!el)return null;const vb=el.getAttribute('viewBox').split(' ').map(Number);const cl=el.cloneNode(true);cl.setAttribute('width',vb[2]*scale);cl.setAttribute('height',vb[3]*scale);cl.removeAttribute('id');return new XMLSerializer().serializeToString(cl);}
function composedSVG(scale){
  const chart=svgChart(C,SEL),ser=seriesList(),rad=radarSVG(ser,VIEW13,false),tab=tableSVG(ser);
  const vb=x=>x.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/).slice(1).map(Number);
  const [w1,h1]=vb(chart),[w2,h2]=vb(rad),[w3,h3]=vb(tab),W=800,g=16,H=h1+g+h2+g+h3;
  const nest=(x,px,py,w,h)=>x.replace('<svg ',`<svg x="${px}" y="${py}" width="${w}" height="${h}" `).replace(' id="chartsvg"','');
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W*scale}" height="${H*scale}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="${pal().dark?'#141518':'#ECE8DF'}"/>${nest(chart,0,0,w1,h1)}${nest(rad,(W-w2)/2,h1+g,w2,h2)}${nest(tab,0,h1+g*2+h2,w3,h3)}</svg>`;
}
async function doExport(kind){
  if(!DL||!C)return;const btn=$(kind==='png'?'b-png':'b-svg');
  try{
    let data;
    if(kind==='svg')data=composedSVG(1);
    else{const s=composedSVG(2),img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);});
      const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;cv.getContext('2d').drawImage(img,0,0);data=await new Promise(r=>cv.toBlob(r,'image/png'));}
    await DL.save({filename:exportName(kind),data});
  }catch(e){if(e&&(e.code==='unavailable'||e.code==='not_granted')){$('b-png').hidden=true;$('b-svg').hidden=true;}}
}
$('tipbar-see').onclick=()=>{const t=$('tipcard');t.scrollIntoView({behavior:'smooth',block:'center'});};
$('tipbar-x').onclick=()=>{try{sessionStorage.setItem('bazi.tipoff','1');}catch(e){}$('tipbar').hidden=true;};
$('b-png').onclick=()=>doExport('png');$('b-svg').onclick=()=>doExport('svg');
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('bazi.lang',lang);}catch(e){}readForm();buildForm();const inp=toInput(FORM);if(C&&!inp.err)C=compute(inp);renderAll();});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>renderAll());
let RZ=null,RW=window.innerWidth;window.addEventListener('resize',()=>{clearTimeout(RZ);RZ=setTimeout(()=>{if(TAB===6&&C&&Math.abs(window.innerWidth-RW)>40){RW=window.innerWidth;renderTab();}},200);});
new MutationObserver(()=>renderAll()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
buildForm();renderStatic();renderLayers();if(FORM.date&&FORM.time)cast();else $('chartwrap').innerHTML=`<div class="empty">${esc(T('emptyHint'))}</div>`;
(async()=>{try{if(window.claude&&typeof window.claude.use==='function'){DL=await window.claude.use('downloads');if(DL){$('b-png').hidden=false;$('b-svg').hidden=false;}}}catch(e){}})();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(C)renderChart();});
</script>
